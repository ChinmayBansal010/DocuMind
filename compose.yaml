services:
  documind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DOCUMIND_DATA_DIR: /app/data
    volumes:
      - documind_data:/app/data
    restart: unless-stopped
volumes:
  documind_data:
